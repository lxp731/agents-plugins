# dsh-network-proxy — bundle patch: server plugin + web settings UI.
# lib/index.js installs the process-wide proxy policy through
# @deepseek-ai/dsh-http-proxy from the live `network-proxy` settings namespace
# (the same policy dsh-web-fetch-http consults) and mirrors the decision into
# $DSH_HOME/.env for the next launch. lib/client.js renders the proxy row in the
# web settings UI (settings.general.item slot).
- insert:
    - id: network-proxy
      name: dsh-network-proxy
